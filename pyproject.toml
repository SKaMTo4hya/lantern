[project]
name = "lantern"
version = "0.2.0"
description = "Local CLI for translating visual novel scripts. Ren'Py first; your model, not a subscription."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lantern = "lantern.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lantern*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
